[workspace]
resolver = "2"
members = [
    "crates/rules",
    "crates/sim",
    "contracts/tidewater",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
rules = { path = "crates/rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
near-sdk = "5"
